# 配置名称: Egern配置
# 配置作者: UncleC0der
# 更新时间: 26-09-05 00:00

# [通用设置]
# 自动更新配置的内容。默认值是空
# auto_update:
#   url: http://example.com/
#   interval: 86400

ipv6: false
http_port: 3080
socks_port: 3090
allow_external_connections: false

# 仅虚拟网接口模式。默认值是 false
vif_only: false

# 全局阻止 QUIC 协议，强制使用 TCP 连接。默认值是 false
# 优先级：代理 > 策略组 > 全局。代理自身的 block_quic 优先级最高，
# 其次是策略组的 block_quic，最后是此全局设置。
# 若三者均未设置，则使用协议默认值（TCP 类协议默认阻止，UDP 类协议默认放行）。
block_quic: false

# 策略组选中节点变化时（手动切换、自动测速切换、故障转移、订阅更新后选中项回退），
# 关闭仍在使用旧节点的连接，使流量立即通过新节点重连。默认值是 false
close_connections_on_policy_change: false

# 绕过隧道代理的域名列表。默认值是空数组
bypass_tunnel_proxy:
  - "*.local"
  - "192.168.0.0/16"

# 使用真实 IP 的域名列表（不使用 Fake IP）。默认值是空数组
real_ip_domains:
  - "*.lan"
  - "*.push.apple.com"

# 隐藏 VPN 图标。默认值是 false
hide_vpn_icon: false

# 劫持 DNS 的地址列表。默认值是空数组
hijack_dns:
  - '*'


geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
proxy_latency_test_url: https://connectivitycheck.gstatic.com/generate_204
direct_latency_test_url: https://www.qq.com

# 兼容路由模式。默认值是 false
compat_route: false

# 包含所有网络流量。默认值是 false。APNs 流量、蜂窝网络服务流量、本地网络流量等都需要 include_all_networks 启用才能包含
include_all_networks: false
include_apns: false
include_cellular_services: false
include_local_networks: false

# 虚拟接口包含的路由。默认值是空数组
vif_included_routes:
  - 192.168.0.1/32

# 虚拟接口排除的路由。默认值是空数组
vif_excluded_routes:
  - 192.168.0.1/32

# [DNS设置]
dns:
  bootstrap:
    - system  # 使用系统默认的 DNS 配置作为引导
    - 223.5.5.5
    - 119.29.29.29
  upstreams:
    国内加密DNS:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    国外加密DNS:
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
  forward:
    - domain_suffix:
        match: cn
        value: 国内加密DNS
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/ChinaDomain.yaml
        value: 国内加密DNS
    - domain_wildcard:
        match: '*'
        value: 国外加密DNS
  # hosts:
  #   example.com: www.example.com
  #   localhost: 127.0.0.1
  #   "*.local": 192.168.1.1
  # block_ips:
  #   - 1.2.3.4
  #   - 4.3.2.1/32
  public_ip_lookup_url: https://ifconfig.me/ip

# 代理列表
proxies:
- vless:
    name: 🏠XIANGCAI
    server: apnow.clickcloud.cc
    port: 443
    user_id: 4395bda7-a2f2-4864-94e8-d5f0b24f70b5
    tfo: false
    udp_relay: true
    flow: xtls-rprx-vision
    transport:
      tls:
        sni: course.clickcloud.cc
        reality:
          public_key: 8Fddr08Kr5sC_zj4dOC6mbysbAvMQABT35hnxnsUZUY
          short_id: 8e99f8
        skip_tls_verify: false

