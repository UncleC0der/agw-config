# URL 重写列表
url_rewrites:
  - match: "(.*google)\\.cn"
    location: $1.com
    status_code: 307

# HTTP 头部重写列表
header_rewrites:
  - add:
      match: "^https://example\\.com"
      name: X-Custom-Header
      value: custom-value
      type: request
  - replace:
      match: "^https://example\\.com"
      name: Cache-Control
      value: no-cache
      type: response
  - delete:
      match: "^https://example\\.com"
      name: X-Tracking-Id
      type: request

# HTTP 消息体重写列表
body_rewrites:
  # 响应体正则替换
  - response_regex:
      match: "^https://example\\.com"
      find: old_content
      replace: new_content
  # 请求体 jq 过滤器
  - request_jq:
      match: "^https://api\\.example\\.com/submit"
      filter: '.data.version = "2.0"'

# 脚本配置列表
scriptings:
  - http_request:
      name: HTTP Script 1
      match: "^https://example\\.com"
      script_url: "https://example.com/scripts/request.js"
      update_interval: 86400
      max_size: 131072
      timeout: 30
      body_required: false
  - http_response:
      name: HTTP Script 2
      match: "^https://example\\.com"
      script_url: "https://example.com/scripts/response.js"
      update_interval: 86400
      max_size: 131072
      timeout: 30
      body_required: false
  - schedule:
      name: Scheduled Script 1
      cron: "0 8 * * *"
      script_url: "https://example.com/scripts/task.js"
      update_interval: 86400
      timeout: 30
  - generic:
      name: Widget Script 1
      script_url: "https://example.com/scripts/widget.js"
      env:
        API_KEY: "your_api_key"
  - network:
      name: Network Script 1
      script_url: "https://example.com/scripts/network.js"

# Map Local 配置。将匹配的 URL 请求映射到本地自定义响应
map_locals:
  - match: "^https://api\\.example\\.com/mock$"
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{"code": 0, "message": "ok"}'

# MITM 配置。中间人解密，用于修改 HTTPS 流量（URL 重写、头部/消息体重写、脚本等）
mitm:
  ca_p12: ""
  ca_passphrase: "123456"
  hostnames:
    includes:
      - "*.example.com"
    excludes:
      - "*.internal.example.com"

# HTTP 抓包配置列表
http_captures:
  - "*.example.com"

# 小组件配置。在主屏幕和锁定屏幕上显示自定义内容，由通用脚本渲染
widgets:
  - name: "Widget Script 1"
    env:
      REGION: "cn"

# 添加订阅时默认使用的外部策略组名称。默认值是空
default_subscription_group: Subscription

# 添加代理时自动加入的策略组名称。默认值是空
default_proxy_group: PROXY

# 模块配置列表
modules:
  - name: "广告过滤"
    url: "https://example.com/module.yaml"
    update_interval: 86400
    enabled: true
  - url: "https://example.com/custom.yaml"
    compat_arguments:
      API_KEY: "your_api_key"