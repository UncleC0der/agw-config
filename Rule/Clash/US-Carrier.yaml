payload:
  # WiFi Calling / VoWiFi: 
  # 美国MCC=310, 需根据具体运营商的MNC代码生成对应域名。例如：
  # 
  # 3GPP标准网络服务域名，部分子域名可能受限
  # *.3gppnetwork.org
  # 运营商EPC核心网域名，格式中的MNC和MCC根据运营商代码变动
  # *.epc.mnc***.mcc***.pub.3gppnetwork.org
  # ss.epdg.epc.mnc<MNC>.mcc<MCC>.pub.3gppnetwork.org
  # ss.epdg.epc.mnc<运营商MNC>.mcc310.pub.3gppnetwork.org


  # AT&T
  - DOMAIN-SUFFIX,ipass.att.com
  - DOMAIN-SUFFIX,portal8.att.com
  - DOMAIN-SUFFIX,att.com
  - DOMAIN-SUFFIX,att.net
  # MNC=410,014
  - DOMAIN-SUFFIX,ss.epdg.epc.mnc410.mcc310.pub.3gppnetwork.org
  - DOMAIN-SUFFIX,ss.epdg.epc.mnc004.mcc310.pub.3gppnetwork.org

  # T‑Mobile
  - DOMAIN-SUFFIX,t‑mobile.com
  - DOMAIN-SUFFIX,t‑mobile.net
  - DOMAIN-SUFFIX,api.t‑mobile.com
  # MNC=260
  - DOMAIN-SUFFIX,epdg.epc.mnc260.mcc310.pub.3gppnetwork.org
  - DOMAIN-SUFFIX,epdg.epc.mnc260.mcc310.pub.3gppnetwork.org
  - DOMAIN-SUFFIX,ss.epdg.epc.geo.mnc260.mcc310.pub.3gppnetwork.org
  - DOMAIN-SUFFIX,ims.mnc260.mcc310.pub.3gppnetwork.org

  # Verizon
  - DOMAIN-SUFFIX,verizon.com
  - DOMAIN-SUFFIX,vzw.com
  - DOMAIN-SUFFIX,vzwapi.verizonwireless.com
  - DOMAIN-SUFFIX,vzw.voip.verizonwireless.com
  # MNC=010
  - DOMAIN-SUFFIX,epdg.epc.mnc010.mcc310.pub.3gppnetwork.org
  - DOMAIN-SUFFIX,epdg.epc.mnc480.mcc311.pub.3gppnetwork.org

  # helium mobile
  - DOMAIN-SUFFIX,hellohelium.com
  - DOMAIN-SUFFIX,heliumwifi.com